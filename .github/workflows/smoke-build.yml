name: Smoke Build
# Builds the base template against the published SDK exactly as a fresh scaffold
# would — a frozen install (resolving @vincentt-xr/sdk from npm), then build +
# typecheck. SDK_LINK is unset, so this is the npm path, not the local-link dev path.
#
# Catches any template change that breaks the production build, and — via the frozen
# lockfile — a dependency bump that wasn't reflected in the lockfile.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # A host's conventional filename may exist only as a POINTER (B-F3-5
      # tripwire c). A pointer that has grown content is a second contract, and
      # the host holding the longer one is the privileged host. These two checks
      # catch the mechanical half of that; the semantic half is review.
      #
      # The filename list lives in .github/pointers.txt, read by this workflow
      # and by release.yml. Adding a second host's pointer is one line there, so
      # the two workflows cannot drift and a new pointer is checked at the tag
      # as well as on the branch.
      #
      # The verb pattern over-matches `vincentt` followed by any lowercase word,
      # not only a verb. That is deliberate: a pointer mentioning `vincentt` in
      # prose is already drifting toward content, and an alternation of the real
      # verb names would be a second copy of the CLI's pinned verb surface in a
      # different repository on a different release cadence.
      - name: Pointers carry no content
        run: |
          if [ ! -f .github/pointers.txt ]; then
            echo "::error::.github/pointers.txt is missing — the pointer checks would silently pass with nothing checked."
            exit 1
          fi
          while read -r f; do
            [ -n "$f" ] || continue
            lines=$(wc -l < "$f")
            bytes=$(wc -c < "$f")
            if [ "$lines" -gt 12 ]; then
              echo "::error file=$f::pointer is $lines lines (max 12) — it has grown content. The loop contract is AGENTS.md."
              exit 1
            fi
            if [ "$bytes" -gt 1200 ]; then
              echo "::error file=$f::pointer is $bytes bytes (max 1200) — it has grown content. The loop contract is AGENTS.md."
              exit 1
            fi
            if grep -qE '(npx )?vincentt [a-z]+' "$f"; then
              echo "::error file=$f::pointer names a vincentt verb — a verb list is the loop contract's job, not a pointer's."
              exit 1
            fi
          done < .github/pointers.txt

      # The withdrawn one-host zero-action path must not return to the contract.
      # Scoped to AGENTS.md ONLY, never to the pointers: a pointer named
      # CLAUDE.md obviously contains the string, which is what a pointer is.
      - name: The loop contract names no host
        run: |
          if grep -qiE 'claude|cursor|codex|copilot|self-schedule' AGENTS.md; then
            echo "::error file=AGENTS.md::the loop contract names a host or the withdrawn self-schedule path (B-F3-5 tripwire a/b)."
            exit 1
          fi

      # create scaffolds an empty folder, then registers. The verb list must say
      # so: grounding ships into creators' repositories and is never read back
      # (B-F3-5 tripwire c), so a behavior change we do not land in the same
      # commit is unseeable, unwarnable and unfixable (B-F2-9).
      - name: The verb list describes what create does about the folder
        run: |
          if ! grep -qiE 'scaffolds the starter first' AGENTS.md; then
            echo "::error file=AGENTS.md::the verb list does not say what \`create\` does about an empty folder. It scaffolds, then registers (create-scaffolds, B-F2-9)."
            exit 1
          fi
          if ! grep -qF 'vincentt init' AGENTS.md; then
            echo "::error file=AGENTS.md::the verb list does not name \`vincentt init\`. An authed path may absorb an unauthenticated capability only while the open route stays named (B-F2-9)."
            exit 1
          fi

      # The recognition section is GENERATED from recognition.md in vincentt-xr/agent-plugin.
      # Checked on the branch as well as at the tag, so a hand-edit is caught in review rather
      # than at release.
      - name: The recognition section is generated, not authored
        run: node scripts/check-recognition.mjs
