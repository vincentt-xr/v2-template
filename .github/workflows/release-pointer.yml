name: Release Pointer
# Daily: `latest` (what `vincentt init` clones when the api cannot be read) must
# be the template version prod's GET /platform/versions names, and the SDK and
# harness it locks must be the versions the template follows (npm's `latest`
# dist-tag). A promote that dies before `Move latest`, or a package that ships
# without the template following, is otherwise silent until a creator scaffolds
# stale code. `latest` trails the newest tag between a tag push and release day.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  check:
    # This file ships into every scaffolded project, which has no `latest` tag.
    if: github.repository == 'vincentt-xr/v2-template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "`latest` is the version prod names and follows npm"
        run: node scripts/check-release-pointer.mjs
